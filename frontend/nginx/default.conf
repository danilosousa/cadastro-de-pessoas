# SPA estática + proxy reverso da API na mesma origem (ADR 0010).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/conf.d/seguranca.inc;

    # /api/list?page=0  ->  http://backend:8089/list?page=0  (a barra final remove o prefixo)
    location /api/ {
        proxy_pass http://backend:8089/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Arquivos do build têm hash no nome (index-DGgDFH5r.js): podem ficar em cache para sempre.
    location /assets/ {
        include /etc/nginx/conf.d/seguranca.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # O index.html aponta para os arquivos com hash: precisa ser revalidado a cada visita.
    location = /index.html {
        include /etc/nginx/conf.d/seguranca.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Fallback da SPA: /pessoas/123 não é um arquivo; quem resolve a rota é o React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
