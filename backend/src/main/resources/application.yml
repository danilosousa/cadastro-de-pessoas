spring:
  application:
    name: prova-fullstack
  datasource:
    # Valores padrão batem com o docker-compose.yml da raiz.
    # Em outro ambiente, sobrescreva com DB_URL / DB_USER / DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prova}
    username: ${DB_USER:prova}
    password: ${DB_PASSWORD:prova}
  jpa:
    # O schema é responsabilidade do Flyway; o Hibernate só confere se bate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cache:
    # Previsões de nacionalidade: 24h, até 1000 nomes em memória (ADR 0007).
    cache-names: nacionalidades
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h,recordStats

nationalize:
  url: ${NATIONALIZE_URL:https://api.nationalize.io}
  timeout: ${NATIONALIZE_TIMEOUT:3s}
  # Opcional. Sem chave: 10 consultas gratuitas. Chave grátis em https://nationalize.io
  api-key: ${NATIONALIZE_API_KEY:}

auth:
  # Usuário criado na inicialização se ainda não existir (ADR 0008).
  admin:
    usuario: ${ADMIN_USUARIO:admin}
    senha: ${ADMIN_SENHA:admin123}
  jwt:
    # Chave HS256: no mínimo 32 caracteres. O padrão serve só para desenvolvimento;
    # em qualquer ambiente compartilhado defina JWT_SEGREDO.
    segredo: ${JWT_SEGREDO:dev-only-troque-este-segredo-com-32+-caracteres}
    expiracao: ${JWT_EXPIRACAO:1h}

cors:
  origens-permitidas: ${CORS_ORIGENS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
