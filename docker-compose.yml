services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prova
      POSTGRES_USER: prova
      POSTGRES_PASSWORD: prova
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prova -d prova"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
