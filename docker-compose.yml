# Sobe tudo:  docker compose up --build   → interface em http://localhost:3005, API em http://localhost:8089
#
# Portas pouco comuns de propósito (3005 e 8089), e o Postgres não é exposto no host:
# assim o compose sobe mesmo se 3000, 8080 ou 5432 já estiverem em uso na máquina.
#
# Só o banco, exposto na 5432, para rodar o backend pela IDE:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres
#
# Valores sensíveis e portas podem ser sobrescritos num arquivo .env (veja .env.example).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prova
      POSTGRES_USER: prova
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prova}
    # Sem "ports": o banco só é acessível na rede interna do compose (postgres:5432).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prova -d prova"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/prova
      DB_USER: prova
      DB_PASSWORD: ${DB_PASSWORD:-prova}
      JWT_SEGREDO: ${JWT_SEGREDO:-dev-only-troque-este-segredo-com-32+-caracteres}
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_SENHA: ${ADMIN_SENHA:-admin123}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173}
      NATIONALIZE_API_KEY: ${NATIONALIZE_API_KEY:-}
    ports:
      - "${APP_PORT:-8089}:8089"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Login automático da interface (ADR 0012): as mesmas credenciais do admin do backend.
        VITE_API_USUARIO: ${ADMIN_USUARIO:-admin}
        VITE_API_SENHA: ${ADMIN_SENHA:-admin123}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3005}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
